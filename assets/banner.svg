<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Claude Business God Mode</title>
  <desc id="d">One umbrella that runs a whole business with Claude: CRM, Meta Ads, SEO and Video Editing God Modes sharing one business profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0d0f24"/>
      <stop offset="1" stop-color="#1a0f1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>
  <rect width="1280" height="440" fill="url(#glow2)"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="110" font-size="15" font-weight="600" letter-spacing="4" fill="#fcd34d">ONE BUSINESS · ONE PROFILE · FOUR GOD MODES</text>
    <text x="72" y="190" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#title)">CLAUDE BUSINESS</text>
    <text x="72" y="262" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#gold)">GOD MODE</text>
    <text x="72" y="314" font-size="20" fill="#cbd5e1">Leads, ads, search and video, run by Claude.</text>
    <text x="72" y="344" font-size="20" fill="#cbd5e1">You approve. It ships.</text>
  </g>

  <!-- orbit diagram -->
  <g transform="translate(950 222)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="4 8"/>
    <circle r="88" fill="none" stroke="#f59e0b" stroke-opacity="0.25"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="0" y1="0" x2="150" y2="0" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="0" y1="0" x2="-150" y2="0" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- crown core -->
    <circle r="54" fill="url(#gold)"/>
    <path d="M-28 14 L-28 -10 L-14 2 L0 -18 L14 2 L28 -10 L28 14 Z" fill="#1a1205"/>
    <rect x="-28" y="18" width="56" height="7" rx="2" fill="#1a1205"/>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <g transform="translate(0 -150)">
        <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#0b1220" stroke="#38bdf8"/>
        <text y="5" fill="#e0f2fe">📇 CRM</text>
      </g>
      <g transform="translate(150 0)">
        <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#0b1220" stroke="#818cf8"/>
        <text y="5" fill="#e0e7ff">📣 Meta Ads</text>
      </g>
      <g transform="translate(0 150)">
        <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#0b1220" stroke="#34d399"/>
        <text y="5" fill="#d1fae5">🔎 SEO</text>
      </g>
      <g transform="translate(-150 0)">
        <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#0b1220" stroke="#e879f9"/>
        <text y="5" fill="#fae8ff">🎬 Video</text>
      </g>
    </g>
  </g>
</svg>
